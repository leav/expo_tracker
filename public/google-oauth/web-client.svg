<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Create an OAuth Web client</title>
  <desc id="desc">Wireframe of Create OAuth client with Application type Web application selected.</desc>
  <rect width="640" height="300" fill="#fafafa"/>
  <rect x="24" y="20" width="592" height="260" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="24" y="20" width="592" height="40" rx="10" fill="#f4f4f5"/>
  <rect x="24" y="50" width="592" height="10" fill="#f4f4f5"/>
  <text x="40" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#171717">Create OAuth client</text>
  <text x="40" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#737373">Application type</text>
  <rect x="40" y="108" width="280" height="44" rx="8" fill="#171717"/>
  <text x="56" y="135" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Web application</text>
  <text x="336" y="135" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#737373">Choose this one</text>
  <rect x="40" y="164" width="280" height="44" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="56" y="191" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#a1a1aa">Desktop app</text>
  <rect x="40" y="220" width="280" height="44" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="56" y="247" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#a1a1aa">iOS / Android</text>
  <text x="336" y="191" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#737373">This local app is a website on</text>
  <text x="336" y="211" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#737373">127.0.0.1, so it needs a Web client.</text>
</svg>
