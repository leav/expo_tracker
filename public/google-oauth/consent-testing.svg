<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">OAuth consent screen stays in Testing</title>
  <desc id="desc">Wireframe of the Google Cloud consent screen with Publishing status Testing and a test user, not published.</desc>
  <rect width="640" height="300" fill="#fafafa"/>
  <rect x="24" y="20" width="592" height="260" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="24" y="20" width="592" height="40" rx="10" fill="#f4f4f5"/>
  <rect x="24" y="50" width="592" height="10" fill="#f4f4f5"/>
  <text x="40" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#171717">OAuth consent screen</text>
  <text x="40" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#737373">Publishing status</text>
  <rect x="40" y="100" width="88" height="28" rx="6" fill="#171717"/>
  <text x="84" y="119" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Testing</text>
  <rect x="136" y="100" width="118" height="28" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="195" y="119" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#a1a1aa">In production</text>
  <text x="268" y="119" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#737373">Stay in Testing. Do not publish.</text>
  <text x="40" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#737373">Test users</text>
  <rect x="40" y="172" width="360" height="36" rx="6" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="56" y="195" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#171717">you@gmail.com</text>
  <rect x="412" y="172" width="72" height="36" rx="6" fill="#ffffff" stroke="#171717"/>
  <text x="448" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717">Add</text>
  <text x="40" y="244" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#737373">Required: add your own Gmail. Google blocks OAuth until you do.</text>
</svg>
