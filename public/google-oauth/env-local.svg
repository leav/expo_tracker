<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Keys in .env.local</title>
  <desc id="desc">Wireframe of a .env.local file with SESSION_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, and optional OWNER_EMAIL.</desc>
  <rect width="640" height="300" fill="#fafafa"/>
  <rect x="24" y="20" width="592" height="260" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="24" y="20" width="592" height="40" rx="10" fill="#f4f4f5"/>
  <rect x="24" y="50" width="592" height="10" fill="#f4f4f5"/>
  <text x="40" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#171717">.env.local</text>
  <rect x="40" y="80" width="560" height="168" rx="8" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="56" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#171717">SESSION_SECRET=</text>
  <text x="214" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#737373">a long random string</text>
  <text x="56" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#171717">GOOGLE_CLIENT_ID=</text>
  <text x="230" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#737373">from the Web client</text>
  <text x="56" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#171717">GOOGLE_CLIENT_SECRET=</text>
  <text x="262" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#737373">from the Web client</text>
  <text x="56" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#a1a1aa">OWNER_EMAIL=</text>
  <text x="198" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#a1a1aa">optional, your Gmail</text>
  <text x="56" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#737373">Save the file, restart pnpm dev, then reload Settings.</text>
</svg>
