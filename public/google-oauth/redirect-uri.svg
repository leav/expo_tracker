<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Authorized redirect URI</title>
  <desc id="desc">Wireframe of the Authorized redirect URIs field with http://127.0.0.1:4747/api/google/callback.</desc>
  <rect width="640" height="300" fill="#fafafa"/>
  <rect x="24" y="20" width="592" height="260" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="24" y="20" width="592" height="40" rx="10" fill="#f4f4f5"/>
  <rect x="24" y="50" width="592" height="10" fill="#f4f4f5"/>
  <text x="40" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#171717">Authorized redirect URIs</text>
  <text x="40" y="96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#737373">URI 1</text>
  <rect x="40" y="108" width="552" height="48" rx="8" fill="#fafafa" stroke="#171717"/>
  <text x="56" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#171717">http://127.0.0.1:4747/api/google/callback</text>
  <text x="40" y="192" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#171717">Use 127.0.0.1, not localhost. They are different to Google.</text>
  <text x="40" y="220" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">After you create the client, copy the client ID and client secret.</text>
  <text x="40" y="248" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">Paste those into .env.local. Do not put them in Settings.</text>
</svg>
